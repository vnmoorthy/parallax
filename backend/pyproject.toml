[project]
name = "parallax-backend"
version = "0.1.0"
description = "Parallax backend — multi-agent data-analysis swarm on Hotdata, RocketRide and Cognee"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "anthropic>=0.40",
    "rocketride>=1.3.0",
    "cognee[anthropic]>=1.5.4",
    "python-dotenv>=1.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
