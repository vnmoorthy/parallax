  <text x="80" y="300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" font-weight="700" fill="url(#t)" letter-spacing="-3">Many agents. Many branches.</text>
  <text x="80" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" font-weight="700" fill="#e6e9f2" letter-spacing="-3">One answer.</text>
  <text x="80" y="455" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" fill="#9aa3b8">Multi-agent data analysis — an isolated database fork per hypothesis, concurrent SQL + search, one cited report.</text>
